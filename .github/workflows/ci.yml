name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Restore, build, test, and smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: src/Tezuri.App/ClientApp/package-lock.json

      - name: Restore locked .NET dependencies
        run: dotnet restore Tezuri.slnx --locked-mode

      - name: Install locked client dependencies
        working-directory: src/Tezuri.App/ClientApp
        run: npm ci --no-audit --no-fund

      - name: Check and build client
        working-directory: src/Tezuri.App/ClientApp
        run: |
          npm run check
          npm test
          npm run build

      - name: Build .NET solution
        run: dotnet build Tezuri.slnx --configuration Release --no-restore

      - name: Test .NET solution
        run: dotnet test Tezuri.slnx --configuration Release --no-build --no-restore

      - name: Verify repository contracts and formatting
        run: |
          dotnet format Tezuri.slnx --verify-no-changes --no-restore
          node eng/verify-repository.mjs
          git diff --check

      - name: Publish the desktop executable
        run: >-
          dotnet publish src/Tezuri.App/Tezuri.App.csproj
          --configuration Release
          --runtime linux-x64
          --self-contained
          -p:PublishSingleFile=true
          --output ${{ runner.temp }}/tezuri-publish

      - name: The published artifact must need no runtime installed
        shell: bash
        run: |
          set -euo pipefail
          test -x "${RUNNER_TEMP}/tezuri-publish/Tezuri.App"
          ! ls "${RUNNER_TEMP}/tezuri-publish"/*.deps.json >/dev/null 2>&1

      - name: Smoke the published executable against a real repository
        shell: bash
        run: |
          set -euo pipefail
          workspace="${RUNNER_TEMP}/tezuri-workspace"
          mkdir -p "${workspace}"
          cp -R samples/folder-native-workspace/. "${workspace}/"
          git -C "${workspace}" init --quiet

          TEZURI_WORKSPACE="${workspace}"             "${RUNNER_TEMP}/tezuri-publish/Tezuri.App" --server > "${RUNNER_TEMP}/tezuri.log" 2>&1 &
          server=$!
          trap 'kill "${server}" 2>/dev/null || true' EXIT

          for _ in $(seq 1 60); do
            origin="$(grep -oE 'http://127\.0\.0\.1:[0-9]+' "${RUNNER_TEMP}/tezuri.log" | head -1 || true)"
            [[ -n "${origin}" ]] && break
            sleep 1
          done
          test -n "${origin}"

          nonce="$(grep -oE 'nonce=[A-Za-z0-9_-]+' "${RUNNER_TEMP}/tezuri.log" | head -1 | cut -d= -f2)"
          test -n "${nonce}"

          curl --fail --silent --show-error "${origin}/api/v1/articles" > /dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}'             --request POST --header 'Content-Type: application/json'             --data '{"title":"Unauthorised"}' "${origin}/api/v1/articles")" = 403
          curl --fail --silent --show-error --request POST             --header 'Content-Type: application/json'             --header "X-Tezuri-Nonce: ${nonce}"             --data '{"title":"CI Smoke"}' "${origin}/api/v1/articles" > /dev/null
          test -f "${workspace}/src/writing/ci-smoke/article.json"
          test -f "${workspace}/src/writing/ci-smoke/index.md"

name: Bounded problem or feature
description: Propose a concrete writing-workflow improvement with an explicit boundary.
title: "proposal: "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and user
      description: Who encounters what concrete problem in the repository-native workflow?
    validations:
      required: true
  - type: textarea
    id: journey
    attributes:
      label: Smallest useful journey
      description: Describe the before/after outcome without prescribing an architecture first.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Real corpus/workspace examples, constraints, frequency, and failed workarounds.
  - type: textarea
    id: boundaries
    attributes:
      label: Boundaries and non-goals
      description: What should remain file-native, offline, explicit, or outside V1?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Observable acceptance
      description: What deterministic tests or dogfood evidence would prove the result?
    validations:
      required: true


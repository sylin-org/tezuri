version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      dotnet-runtime:
        patterns:
          - "Microsoft.*"
      test-tooling:
        patterns:
          - "xunit*"
          - "coverlet*"
      koan:
        patterns:
          - "Sylin.Koan*"

  - package-ecosystem: npm
    directory: /src/Tezuri.App/ClientApp
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      client-runtime:
        dependency-type: production
      client-tooling:
        dependency-type: development

  - package-ecosystem: npm
    directory: /eng/runtime-npm
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      proof-runtime:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      runtime-images:
        patterns:
          - "*"

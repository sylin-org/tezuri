name: tezuri

services:
  app:
    image: ghcr.io/sylin-org/tezuri:local
    build:
      context: .
    init: true
    restart: "no"
    read_only: true
    user: "${TEZURI_UID:-1654}:${TEZURI_GID:-1654}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${TEZURI_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      DOTNET_EnableDiagnostics: "0"
      NPM_CONFIG_CACHE: /tmp/tezuri/npm
      TEZURI_WORKSPACE: /workspace
      XDG_CACHE_HOME: /tmp/tezuri/cache
    volumes:
      - type: bind
        source: "${TEZURI_WORKSPACE:?Set TEZURI_WORKSPACE to the absolute repository path}"
        target: /workspace
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
      - /app/data:rw,nosuid,nodev,size=64m,mode=1777

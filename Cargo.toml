[package]
name = "tezuri"
version = "0.1.0"
edition = "2021"
description = "A desk for an author's entire publishing life."

[workspace]
members = ["src-tauri"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
walkdir = "2"
tempfile = "3"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tauri = "2.11.5"
tauri-build = "2.6.3"

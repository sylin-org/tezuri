# Tezuri reads this committed file from the mounted repository.
schema: tezuri.workspace/v1
site:
  url: https://example.test
articles:
  root: src/writing
  fileName: index.md
  mediaDirectory: media
  metadataSchema: schemas/article-v1.schema.json
  editorHints: schemas/editor-hints-v1.json
media:
  requireOwnedAssets: true
  maximumAssetBytes: 26214400
  allowedExtensions:
    - .avif
    - .gif
    - .jpeg
    - .jpg
    - .png
    - .webp
proof:
  workingDirectory: .
  commands:
    - id: site-test
      executable: npm
      arguments:
        - test
      timeoutSeconds: 300
      outputDirectory: dist
git:
  allowedPaths:
    - src/writing/**
    - schemas/article-v1.schema.json
    - tezuri.yaml

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} — {{site_name}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #0d0b09; color: #ede6d6;
    font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .shell { max-width: 1280px; margin: 0 auto; padding-left: clamp(20px, 3.5vw, 56px); padding-right: clamp(20px, 3.5vw, 56px); }

  /* ---- frame: the ARTICLE title-banner mode ---- */
  .title-banner { position: relative; overflow: hidden; margin: 0 calc(-1 * clamp(20px, 3.5vw, 56px)); border-radius: 0; border: none; border-bottom: 1px solid #221d16; background: #1d1813; }
  .title-banner--cover { position: absolute; inset: 0; background-size: cover; background-position: center; }
  .title-banner--cover.cover-fill { background-size: 100% 100%; }
  .title-banner--cover.cover-contain { background-size: contain; background-repeat: no-repeat; }
  .title-banner--cover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.85), rgba(0,0,0,.6) 50%, rgba(0,0,0,.3)); }
  .title-banner--inner { position: relative; max-width: none; padding-top: clamp(60px, 9vw, 140px); padding-bottom: clamp(40px, 5vw, 80px); }
  .title-banner--inner::before { content: "GPOSINGWAY"; display: block; margin: 0 0 12px; font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 11px; text-transform: uppercase; letter-spacing: .14em; color: #968b78; }
  .title-banner--title { margin: 12px 0 0; max-width: 24ch; font-family: "Instrument Serif", Georgia, serif; font-style: italic; font-weight: 400; font-size: clamp(36px, 5vw, 68px); line-height: 1.05; color: #ede6d6; text-shadow: 0 2px 8px rgba(0,0,0,.7); }
  .title-banner--standfirst { margin: 16px 0 0; max-width: 60ch; font-family: "Instrument Serif", Georgia, serif; font-style: italic; font-weight: 400; font-size: clamp(17px, 1.4vw, 22px); color: rgba(237,230,214,.85); text-shadow: 0 1px 4px rgba(0,0,0,.7); }
  .title-banner--meta { margin-top: 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 11px; text-transform: uppercase; letter-spacing: .14em; color: #968b78; }
  .tagpill { display: inline-flex; align-items: center; border: 1px solid #221d16; border-radius: 999px; padding: 2px 10px; font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 10px; text-transform: uppercase; letter-spacing: .14em; color: #968b78; }

  /* ---- columns ---- */
  .pagegrid { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: clamp(40px, 5vw, 80px); padding-top: clamp(40px, 5vw, 72px); padding-bottom: clamp(40px, 5vw, 72px); }
  .pagegrid > .title-banner { grid-column: 1 / -1; margin-left: calc(-1 * clamp(20px, 3.5vw, 56px)); margin-right: calc(-1 * clamp(20px, 3.5vw, 56px)); }
  .pagegrid > .article-prose { grid-column: 1; min-width: 0; }
  .pagegrid > .toc-rail { grid-column: 2; align-self: start; }
  .article-prose img { max-width: 100%; height: auto; border-radius: 4px; cursor: zoom-in; }
  .article-prose .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; margin: 1.6em 0; }
  .article-prose .gallery img { width: 100%; height: 160px; object-fit: cover; }

  /* ---- sidebar ---- */
  .toc-rail { display: flex; flex-direction: column; gap: 32px; }
  @media (min-width: 1024px) { .pagegrid > .toc-rail { position: sticky; top: 80px; } }
  .toc-rail h2 { margin: 0 0 12px; font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 11px; text-transform: uppercase; letter-spacing: .14em; color: #4a8bb8; font-weight: 400; }
  .toc-rail .tags-title { color: #968b78; }
  .toc { margin: 0; }
  .toc a { display: block; padding: 2px 0; font-size: 13px; line-height: 1.4; color: #968b78; text-decoration: none; transition: color .15s; border-left: 2px solid transparent; }
  .toc a:hover { color: #ede6d6; }
  .toc a.current { color: #4a8bb8; border-left: 2px solid #4a8bb8; margin-left: -8px; padding-left: 8px; }
  .toc a.l3 { padding-left: 12px; }
  .toc a.current.l3 { padding-left: 8px; }
  .tagrow { display: flex; flex-wrap: wrap; gap: 6px; }
  .site-cta a { display: inline-flex; width: 100%; align-items: center; justify-content: center; gap: 8px; border: 1px solid #221d16; background: #14110d; border-radius: 999px; padding: 8px 16px; font-size: 13px; color: #ede6d6; text-decoration: none; transition: color .15s, border-color .15s; }
  .site-cta a:hover { border-color: #2a5775; color: #4a8bb8; }

  footer { border-top: 1px solid #221d16; margin-top: 24px; padding: 20px 0 40px; color: #57503f; font-size: 12px; }

  /* ---- lightbox: provided by Tezuri's behaviors ---- */
  .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.9); display: none; align-items: center; justify-content: center; cursor: zoom-out; z-index: 50; }
  .lightbox.on { display: flex; }
  .lightbox img { max-width: 94vw; max-height: 94vh; }
  @media (max-width: 1023px) {
    .pagegrid { grid-template-columns: 1fr; }
    .pagegrid > .article-prose { grid-column: 1; }
    .pagegrid > .toc-rail { grid-column: 1; order: -1; }
  }
</style>
</head>
<body class="{{body_class}}">
<div class="shell">
  <div class="pagegrid">
    {{ARTICLE | title-banner, cover:natural}}
    <aside class="toc-rail">
      <section>
        <h2>IN THIS ARTICLE</h2>
        {{toc}}
      </section>
      <section>
        <h2 class="tags-title">TAGGED</h2>
        <div class="tagrow">{{tags}}</div>
      </section>
      {{site_cta}}
      <section>
        <h2 class="tags-title">ELSEWHERE</h2>
        {{article-list | count:5}}
      </section>
      {{home_link}}
    </aside>
  </div>
  <footer>{{site_name}} · rendered from plain files</footer>
</div>
</body>
</html>

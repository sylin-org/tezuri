<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} — {{site_name}}</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #0f0e12; color: #c9c9d1;
    font: 400 17px/1.75 Georgia, "Times New Roman", serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: #7ab7ff; }
  .page { max-width: 1100px; margin: 0 auto; padding: 0 24px 80px; }
  .hero { max-width: none; margin: 0 -24px; position: relative; overflow: hidden;
          border-bottom: 1px solid rgba(255,255,255,.06); background: #14121a; }
  .hero-img { position: absolute; inset: 0; width: 100%; height: 100%;
              object-fit: cover; opacity: .65; }
  .hero .scrim { position: absolute; inset: 0;
                 background: linear-gradient(to top, rgba(0,0,0,.85), rgba(0,0,0,.6) 55%, rgba(0,0,0,.3)); }
  .hero-inner { position: relative; max-width: 1100px; margin: 0 auto;
                padding: clamp(60px, 9vw, 130px) 24px clamp(36px, 5vw, 72px); }
  .hero .kicker { font: 400 11px/1 ui-monospace, Consolas, monospace;
                  letter-spacing: .14em; color: #a1a1aa; text-transform: uppercase;
                  margin: 0; }
  h1.art-title { font: 400 44px/1.15 Georgia, serif; color: #f4f4f5; margin: 12px 0 8px; }
  .hero .standfirst { font-style: italic; color: rgba(244,244,245,.85); font-size: 1.1em; margin: 0 0 14px; }
  .metaline { display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
              color: #a1a1aa; font: 400 11px/1 ui-monospace, Consolas, monospace;
              text-transform: uppercase; letter-spacing: .14em; }
  .metaline .dot { opacity: .5; }
  .article-cols { display: flex; gap: 48px; align-items: flex-start;
                  padding-top: clamp(40px, 5vw, 68px); }
  .article { flex: 1; min-width: 0; max-width: 46em; }
  .tagpill { display: inline-flex; align-items: center; border: 1px solid rgba(255,255,255,.12);
             border-radius: 999px; padding: 2px 10px; font-size: 10px;
             font-family: ui-monospace, Consolas, monospace; text-transform: uppercase;
             letter-spacing: .14em; color: #a1a1aa; }
  .toc-rail { width: 250px; flex: none; position: sticky; top: 32px; align-self: flex-start; }
  .toc-rail h2 { font: 400 10px/1 ui-monospace, monospace; letter-spacing: .14em;
                 color: #a1a1aa; margin: 0 0 10px; text-transform: uppercase; }
  .toc-rail a { display: block; padding: 4px 0 4px 10px; font: 400 13px/1.4 sans-serif;
                color: #a1a1aa; text-decoration: none;
                border-left: 2px solid transparent; }
  .toc-rail a:hover { color: #e4e4e7; }
  .toc-rail a.current { color: #e4e4e7; border-left-color: #e4e4e7; }
  .toc-rail .tags { margin-top: 26px; }
  .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
             gap: 8px; margin: 1.6em 0; }
  .gallery img { width: 100%; height: 160px; object-fit: cover; border-radius: 4px;
                 cursor: zoom-in; }
  .article img { max-width: 100%; height: auto; border-radius: 4px; }
  .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.88);
              display: none; align-items: center; justify-content: center;
              cursor: zoom-out; z-index: 50; }
  .lightbox.on { display: flex; }
  .lightbox img { max-width: 94vw; max-height: 94vh; }
  footer.page { color: #52525b; font: 400 12px/1.6 sans-serif;
                border-top: 1px solid rgba(255,255,255,.06); margin-top: 60px;
                padding-top: 20px; }
  @media (max-width: 900px) { .toc-rail { display: none; } }
  {{css}}
</style>
</head>
<body class="theme-scope">
<header class="hero">
  {{cover_img}}
  <div class="scrim"></div>
  <div class="hero-inner">
    {{kicker_line}}
    <h1 class="art-title">{{title}}</h1>
    {{standfirst_line}}
    <div class="metaline">
      <span>{{date}}</span><span class="dot">·</span>
      <span>{{read_time}} min read</span>{{tags_inline}}
    </div>
  </div>
</header>
<div class="page">
  <div class="article-cols">
    <article class="article">
      <div class="art-body">
{{body}}
      </div>
    </article>
    <aside class="toc-rail">
      <h2>IN THIS ARTICLE</h2>
      {{toc}}
      <div class="tags">
        <h2>TAGGED</h2>
        {{tags_block}}
      </div>
      {{cta}}
    </aside>
  </div>
  <footer class="page">
    {{site_name}} · rendered from plain files
  </footer>
</div>
<div class="lightbox" id="lb"><img id="lb-img" alt=""></div>
<script>
  document.querySelectorAll('.article img').forEach(function (img) {
    img.addEventListener('click', function () {
      var lb = document.getElementById('lb');
      document.getElementById('lb-img').src = img.src;
      lb.classList.add('on');
    });
  });
  document.getElementById('lb').addEventListener('click', function () {
    this.classList.remove('on');
  });
  // Scroll-spy: the rail's current section follows the reader.
  (function () {
    var links = [].slice.call(document.querySelectorAll('.toc-rail a[href^="#"]'));
    if (!links.length || !('IntersectionObserver' in window)) return;
    var byId = {};
    links.forEach(function (l) { byId[l.getAttribute('href').slice(1)] = l; });
    var obs = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (!en.isIntersecting) return;
        links.forEach(function (l) { l.classList.remove('current'); });
        var link = byId[en.target.id];
        if (link) link.classList.add('current');
      });
    }, { rootMargin: '-80px 0px -70% 0px', threshold: 0 });
    Object.keys(byId).forEach(function (id) {
      var el = document.getElementById(id);
      if (el) obs.observe(el);
    });
  })();
</script>
</body>
</html>

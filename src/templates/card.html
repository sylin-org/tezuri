<!-- An embeddable card for this article: paste-friendly, self-contained. -->
<figure class="tezuri-card" style="margin:0;max-width:520px;border:1px solid #d8dee4;border-radius:10px;overflow:hidden;font-family:Georgia,'Times New Roman',serif;background:#ffffff;color:#1f2328;">
  {{cover_img}}
  <figcaption style="padding:14px 16px;display:flex;flex-direction:column;gap:6px;">
    <span style="font:500 11px/1 ui-monospace,Consolas,monospace;letter-spacing:.12em;text-transform:uppercase;color:#57606a;">{{site_name}}</span>
    <a class="tezuri-card--link" href="{{self_url}}" style="font-size:1.15em;line-height:1.3;color:#1f2328;text-decoration:none;">{{title}}</a>
    {{standfirst}}
    <span style="font:400 11px/1 ui-monospace,Consolas,monospace;letter-spacing:.1em;color:#57606a;">{{date | iso}} · {{reading_time}} min</span>
  </figcaption>
</figure>
